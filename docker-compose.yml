services:
  postgres:
    image: postgres:16-alpine
    container_name: syncscript-postgres
    environment:
      POSTGRES_USER: syncscript
      POSTGRES_PASSWORD: syncscript
      POSTGRES_DB: syncscript
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syncscript"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: syncscript-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
